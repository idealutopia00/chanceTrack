[project]
name = "chance-track"
version = "1.0.0"
description = "Asset-centric local market observations, signals, and decision journal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "chinese-calendar>=1.10,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
chance-track = "chance_track.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
