</script><script>const chartTheme=getComputedStyle(document.documentElement);const themeValue=(name,fallback)=>chartTheme.getPropertyValue(name).trim()||fallback;const colors={card:themeValue('--card','Canvas'),muted:themeValue('--muted-foreground','GrayText'),border:themeValue('--border','GrayText'),secondary:themeValue('--secondary','Canvas'),up:themeValue('--destructive','red'),down:themeValue('--success','green'),dif:themeValue('--chart-3','orange'),dea:themeValue('--chart-4','purple')};
/* Chart rendering only: indicator values come from the saved Python result. */
(() => {
  const dataNode = document.getElementById('chart-data');
  if (!dataNode) return;
  const items = JSON.parse(dataNode.textContent);
  const container = document.getElementById('chart');
  const empty = document.getElementById('chart-empty');
  const markerToggle = document.getElementById('show-markers');
  const library = window.LightweightCharts;
  let chart, candles, dif, dea, histogram, markers, selected, range = 126;
  const number = value => Number(value).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const dayKey = time => typeof time === 'string' ? time : (time && typeof time === 'object' ? `${time.year}-${String(time.month).padStart(2,'0')}-${String(time.day).padStart(2,'0')}` : '');
  function message(title, detail) {
    empty.replaceChildren();
    const heading = document.createElement('strong'); heading.textContent = title;
    const text = document.createElement('span'); text.textContent = detail;
    empty.append(heading, text); empty.hidden = false;
  }
  function legend(point) {
    for (const [id, key] of [['legend-dif','dif'],['legend-dea','dea'],['legend-hist','histogram']]) {
      document.getElementById(id).textContent = point ? point[key].toFixed(3) : '—';
    }
  }
  function showOHLC(row) {
    const target = document.getElementById('ohlc'); target.replaceChildren();
    if (!row) return;
    const date = document.createElement('span'); date.className = 'date'; date.textContent = row.time; target.append(date);
    for (const [name, key] of [['开','open'],['高','high'],['低','low'],['收','close']]) {
      const span = document.createElement('span'); span.textContent = name;
      const value = document.createElement('b'); value.textContent = number(row[key]); span.append(value); target.append(span);
    }
  }
  function setRange() {
    if (!chart || !selected?.result?.chart) return;
    const count = selected.result.chart.candles.length;
    if (range === 'all') chart.timeScale().fitContent();
    else chart.timeScale().setVisibleLogicalRange({from: Math.max(0,count-Number(range)), to: count+3});
  }
  function setMarkers() {
    if (!markers || !selected?.result?.chart) return;
    markers.setMarkers(markerToggle.checked ? selected.result.chart.crosses.map(cross => ({
      time: cross.time, position: cross.kind === 'golden' ? 'belowBar' : 'aboveBar',
      color: cross.kind === 'golden' ? colors.dif : colors.dea,
      shape: cross.kind === 'golden' ? 'arrowUp' : 'arrowDown', text: cross.kind === 'golden' ? '金叉' : '死叉',
    })) : []);
  }
  function initialize() {
    if (!library) return false;
    chart = library.createChart(container, {autoSize: true, layout: {background: {type:'solid', color:colors.card}, textColor:colors.muted, fontSize:10, attributionLogo:true, panes:{separatorColor:colors.border, separatorHoverColor:colors.muted, enableResize:false}},
      grid: {vertLines:{color:colors.border}, horzLines:{color:colors.border}},
      crosshair:{mode:library.CrosshairMode.Normal,vertLine:{color:colors.muted,labelBackgroundColor:colors.secondary},horzLine:{color:colors.muted,labelBackgroundColor:colors.secondary}},
      rightPriceScale:{borderColor:colors.border,minimumWidth:68,scaleMargins:{top:0.12,bottom:0.12}},
      timeScale:{borderColor:colors.border,timeVisible:false,rightOffset:4},localization:{locale:'zh-CN'}});
    candles = chart.addSeries(library.CandlestickSeries, {upColor:colors.up,downColor:colors.down,borderVisible:false,wickUpColor:colors.up,wickDownColor:colors.down,priceFormat:{type:'price',precision:2,minMove:.01}});
    histogram = chart.addSeries(library.HistogramSeries, {priceLineVisible:false,lastValueVisible:false,priceFormat:{type:'price',precision:3,minMove:.001}},1);
    dif = chart.addSeries(library.LineSeries,{color:colors.dif,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerRadius:3},1);
    dea = chart.addSeries(library.LineSeries,{color:colors.dea,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerRadius:3},1);
    histogram.createPriceLine({price:0,color:colors.muted,lineWidth:1,lineStyle:2,axisLabelVisible:false,title:''});
    chart.panes()[0].setHeight(380); chart.panes()[1].setHeight(180);
    markers = library.createSeriesMarkers(candles,[]);
    chart.subscribeCrosshairMove(param => {
      const content = selected?.result?.chart; if (!content) return;
      const key = dayKey(param.time);
      const point = content.macd.find(row => row.time === key) || content.macd.at(-1);
      const row = content.candles.find(row => row.time === key) || content.candles.at(-1);
      legend(point); showOHLC(row);
    });
    return true;
  }
  function select(id) {
    selected = items.find(item => item.asset.id === id); if (!selected) return;
    document.querySelectorAll('[data-asset]').forEach(button => { const active = button.dataset.asset === id; button.classList.toggle('active',active); button.setAttribute('aria-pressed',String(active)); });
    document.querySelectorAll('[data-detail]').forEach(panel => panel.hidden = panel.dataset.detail !== id);
    document.getElementById('chart-title').textContent = selected.asset.label;
    const symbol = document.createElement('small'); symbol.textContent = selected.asset.ticker || selected.asset.code || ''; document.getElementById('chart-title').append(symbol);
    document.getElementById('chart-market').textContent = selected.asset.market ? `${selected.asset.market} · ${selected.asset.currency}` : '历史报告 · 基金净值';
    const content = selected.result?.chart;
    if (!content) { legend(null); showOHLC(null); message('暂无可用 K 线', selected.result ? '这份历史报告采用基金净值，保留原始结果，不生成虚构 OHLC。' : '该标的行情未成功采集，请查看右侧说明。'); return; }
    if (!library) { message('图表组件未加载','请刷新页面，或检查本地图表静态资源。'); return; }
    try {
      if (!chart) initialize();
      candles.setData(content.candles);
      histogram.setData(content.macd.map(point => ({time:point.time,value:point.histogram,color:point.histogram >= 0 ? colors.up : colors.down})));
      dif.setData(content.macd.map(point => ({time:point.time,value:point.dif})));
      dea.setData(content.macd.map(point => ({time:point.time,value:point.dea})));
      setMarkers(); setRange(); legend(content.macd.at(-1)); showOHLC(content.candles.at(-1));
      empty.hidden = true; container.dataset.ready = 'true';
    } catch (error) { container.dataset.ready = 'false'; console.error(error); message('图表加载失败','请刷新页面；完整行情快照仍可在下方查看。'); }
  }
  document.querySelectorAll('[data-asset]').forEach(button => button.addEventListener('click',() => select(button.dataset.asset)));
  document.querySelectorAll('[data-range]').forEach(button => button.addEventListener('click',() => {range=button.dataset.range; document.querySelectorAll('[data-range]').forEach(other => other.classList.toggle('active',other===button)); setRange();}));
  markerToggle.addEventListener('change',setMarkers);
  select(items[0]?.asset.id);
})();
</script></body></html>
