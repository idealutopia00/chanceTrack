<dialog id="symbols-dialog" class="workspace-dialog" aria-labelledby="symbols-title"><div class="dialog-heading"><h2 id="symbols-title">搜索标的</h2><button type="button" data-close aria-label="关闭搜索">×</button></div><label class="field-label">名称 / 代码<input id="symbol-query" type="search" placeholder="标普、纳斯达克、黄金、SOX…" autocomplete="off"></label><div id="symbol-results"></div><details><summary>没有找到？手动添加</summary><form id="manual-asset-form"><p class="muted">启用前会联网核对身份、市场时区和行情质量。</p><label class="field-label">名称<input name="label" required maxlength="100"></label><label class="field-label">代码<input name="code" required></label><label class="field-label">市场<select name="profile"><option value="yahoo:us_equity">美国指数 · Yahoo</option><option value="eastmoney:cn_equity">中国指数 · 东方财富</option><option value="eastmoney:sge_gold">上金所黄金 · 东方财富</option></select></label><label class="field-label">东方财富 secid（例如 2.931643）<input name="secid"></label><label class="field-label">东方财富精确名称<input name="expected_name"></label><button type="submit">验证并加入列表</button></form></details><p class="dialog-status" role="status"></p></dialog>
<dialog id="indicator-dialog" class="workspace-dialog" aria-labelledby="indicator-title"><div class="dialog-heading"><h2 id="indicator-title">添加指标</h2><button type="button" data-close aria-label="关闭指标">×</button></div><p>添加到图表只用于探索，不改变自动监测。</p><div class="indicator-catalog"></div><p class="dialog-status" role="status"></p></dialog>
<dialog id="indicator-settings" class="workspace-dialog" aria-labelledby="settings-title"><div class="dialog-heading"><h2 id="settings-title">调整指标</h2><button type="button" data-close aria-label="关闭设置">×</button></div><div id="indicator-fields"></div><p>参数修改自动预览，不重新采集行情。</p><p class="dialog-status" role="status"></p></dialog>
<dialog id="monitor-dialog" class="workspace-dialog" aria-labelledby="monitor-title"><div class="dialog-heading"><h2 id="monitor-title">加入 / 更新监测</h2><button type="button" data-close aria-label="关闭监测">×</button></div><div id="monitor-summary"></div><label class="field-label">保存方式<select id="monitor-scope"><option value="local">为当前标的保存独立配置（推荐）</option><option value="shared">更新原共享配置</option></select></label><div id="monitor-affected"></div><button type="button" id="confirm-monitor">保存监测 · 下次检查生效</button><p class="dialog-status" role="status"></p></dialog>
<dialog id="templates-dialog" class="workspace-dialog" aria-labelledby="templates-title"><div class="dialog-heading"><h2 id="templates-title">指标模板</h2><button type="button" data-close aria-label="关闭模板">×</button></div><p>模板随图表切换标的，不修改各标的的监测规则。</p><div id="template-list"></div><form id="template-form"><label class="field-label">模板名称<input name="name" id="template-name" required maxlength="100"></label><button type="submit">另存为新模板</button><button type="button" id="update-template" disabled>更新所选模板版本</button></form><p class="dialog-status" role="status"></p></dialog>
<dialog id="asset-settings" class="workspace-dialog" aria-labelledby="asset-settings-title"><div class="dialog-heading"><h2 id="asset-settings-title">观察标的设置</h2><button type="button" data-close aria-label="关闭标的设置">×</button></div><form id="asset-settings-form"><label class="field-label">显示名称<input name="label" required maxlength="100"></label><label class="field-label">分组<input name="group" maxlength="100" placeholder="例如：美国指数、国内指数、黄金"></label><label class="field-label">状态<select name="state"><option value="enabled">启用</option><option value="disabled">停用</option><option value="archived">归档（保留历史）</option></select></label><button type="submit">保存设置</button></form><div id="asset-monitors"></div><p class="dialog-status" role="status"></p></dialog>
