name: Maintenance checks

on:
  push:
    branches:
      - self-iteration
      - 'maintenance/**'

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv run python scripts/check_project.py
      - run: uv run pytest -q
      - run: node tests/check_updates.mjs
